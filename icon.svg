<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2430"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#212a36" stroke-width="12"/>
  <!-- RPM Arc -->
  <path d="M 108 340 A 170 170 0 1 1 404 340" fill="none" stroke="#37474f" stroke-width="20" stroke-linecap="round"/>
  <!-- VTEC Redline Section -->
  <path d="M 330 134 A 170 170 0 0 1 404 340" fill="none" stroke="#ff1744" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="32" fill="#263238" stroke="#ff1744" stroke-width="6"/>
  <!-- Needle at 6500 RPM -->
  <polygon points="256,236 380,170 256,276" fill="url(#needle)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  <!-- Text Label -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">CIVIC</text>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#00e676" text-anchor="middle" letter-spacing="2">BLE OBD</text>
</svg>
